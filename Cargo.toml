[workspace]
resolver = "2"
members = [
    "facade",
    "crates/me/client",
    "crates/book",
    "crates/contracts",
    "crates/fix",
    "crates/fixed",
    "crates/itch",
    "crates/mold",
    "crates/sim-harness",
    "crates/soup",
    "crates/stamp",
    "crates/wire",
]



[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Exchange8-dev/exchange8-sdk"
rust-version = "1.85"

[workspace.dependencies]
exchange8-book = { path = "crates/book" }
exchange8-contracts = { path = "crates/contracts" }
exchange8-me-client = { path = "crates/me/client" }
exchange8-fix = { path = "crates/fix" }
exchange8-fixed = { path = "crates/fixed" }
exchange8-itch = { path = "crates/itch" }
exchange8-mold = { path = "crates/mold" }
exchange8-soup = { path = "crates/soup" }
exchange8-stamp = { path = "crates/stamp" }
exchange8-wire = { path = "crates/wire" }
exchange8 = { path = "facade" }

# full platform dep table (mirrors sentin8-sdk) + intra-vertical
# contracts path deps. Platform sentin8-* crates arrive via the
# sentin8 facade git pin — never as local paths (RS §2.3).
axum = { version = "0.8", features = ["macros"] }
hyper = { version = "1", features = ["full"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["trace", "cors", "compression-gzip", "limit"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls-native-roots-no-provider"], default-features = false }
tokio-stream = "0.1"
bytes = "1"
tokio-tungstenite = { version = "0.30", features = ["connect", "rustls-tls-native-roots"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-futures = "0.2"
once_cell = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls-ring", "postgres", "uuid", "chrono", "json", "macros", "rust_decimal"] }
time = "0.3.36"
jsonwebtoken = "9"
rand = "0.8"
sha2 = "0.10"
hmac = "0.12"
sha1 = "0.10"
p256 = { version = "0.13", features = ["ecdsa", "ecdsa-core", "pem"] }
ciborium = "0.2"
aes-gcm = "0.10"
zeroize = "1"
ring = "0.17"
rsa = { version = "0.9", features = ["sha2"] }
bcrypt = "0.15"
async-trait = "0.1"
futures-util = "0.3"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
ulid = { version = "1", features = ["serde"] }
base64 = "0.22"
rust_decimal = { version = "1", features = ["serde-with-str", "db-postgres"] }
figment = { version = "0.10", features = ["env", "toml"] }
dotenvy = "0.15"
prometheus = "0.13"
opentelemetry = "0.27"
validator = { version = "0.18", features = ["derive"] }
sentin8 = { git = "https://github.com/Sentin8/sentin8-sdk", tag = "sdk-v0.6.4" }
utoipa = { version = "5", features = ["chrono", "uuid"] }
exchange8-sim-harness = { path = "crates/sim-harness" }
arc-swap = "1"
http = "1"
parking_lot = "0.12"
tokio-rustls = "0.26"
