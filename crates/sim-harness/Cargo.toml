[package]
name = "exchange8-sim-harness"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
serde = { workspace = true }
thiserror = { workspace = true }
# Facade dep: the #[path]-included service modules (gateway submission,
# me engine, clearing projector) reference `exchange8::{leaf}` paths.
exchange8.workspace = true
exchange8-fixed = { workspace = true }
exchange8-contracts = { workspace = true }

# Flow tests (tests/flow_gateway_me_clearing.rs) include me/engine.rs,
# which pulls exchange8_book. Test-only.
[dev-dependencies]
exchange8-book = { workspace = true }
tokio = { workspace = true }

[features]
default = []
# Tree-layout-only flow test (tests/flow_gateway_me_clearing.rs — see its
# header and DESIGN.md §9): embeds the REAL gateway/me/clearing cores via
# include! paths that resolve only in the aggregation-tree layout. CI
# (single-repo checkout) leaves this OFF; the tree operator turns it on.
tree_flows = []
